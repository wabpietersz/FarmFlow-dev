services:
  postgres:
    image: postgres:15-alpine
    container_name: farmflow-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farmflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmflow_prod}
      POSTGRES_DB: ${POSTGRES_DB:-farmflow_prod}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-farmflow} -d ${POSTGRES_DB:-farmflow_prod}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - farmflow

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: farmflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-farmflow}:${POSTGRES_PASSWORD:-farmflow_prod}@postgres:5432/${POSTGRES_DB:-farmflow_prod}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-in-production}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    networks:
      - farmflow

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    container_name: farmflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${APP_PORT:-80}:80'
    networks:
      - farmflow

volumes:
  pgdata_prod:
    driver: local

networks:
  farmflow:
    driver: bridge
