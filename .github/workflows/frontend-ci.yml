name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/frontend/**'
      - 'packages/shared/**'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'packages/frontend/**'
      - 'packages/shared/**'

jobs:
  lint-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Lint frontend
        run: npm run lint -w packages/frontend

      - name: Build frontend
        run: npm run build:frontend

      - name: Run frontend tests
        run: npm run test:frontend
